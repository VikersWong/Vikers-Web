<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 合作：简洁握手 -->
  <defs>
    <linearGradient id="hc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9"/>
      <stop offset="100%" style="stop-color:#357ABD"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="46" fill="none" stroke="url(#hc)" stroke-width="2" opacity="0.3"/>
  <!-- 左侧手臂 -->
  <path d="M20,52 Q20,34 32,28 Q40,24 46,30" fill="none" stroke="url(#hc)" stroke-width="5" stroke-linecap="round"/>
  <!-- 右侧手臂 -->
  <path d="M80,52 Q80,34 68,28 Q60,24 54,30" fill="none" stroke="#74B9FF" stroke-width="5" stroke-linecap="round"/>
  <!-- 中间握手点 -->
  <ellipse cx="50" cy="32" rx="6" ry="4" fill="#FDCB6E"/>
  <!-- 底部弧线 -->
  <path d="M30,70 Q50,80 70,70" fill="none" stroke="url(#hc)" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
</svg>
